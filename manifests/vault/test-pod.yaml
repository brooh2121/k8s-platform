# Учебный под для Vault Agent Injector.
# SA test-sa должен совпадать с ролью test-role в Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-sa
  namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: test-vault-pod
  namespace: default
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "test-role"
    vault.hashicorp.com/agent-inject-secret-test.txt: "secret/data/test"
spec:
  serviceAccountName: test-sa
  containers:
  - name: app
    image: alpine:latest
    command: ["sh", "-c", "cat /vault/secrets/test.txt && sleep 3600"]